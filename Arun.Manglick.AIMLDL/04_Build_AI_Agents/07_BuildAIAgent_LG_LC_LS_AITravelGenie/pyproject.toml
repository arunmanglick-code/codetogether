[project]
name = "ai-travel-genie"
version = "0.1.0"
description = "Multi-agent vacation planner using LangChain, LangGraph, and LangSmith"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-anthropic>=0.3.0",
    "langchain-ollama>=0.2.0",
    "langchain-community>=0.3.0",
    "langchain-openai>=0.2.0",
    "langsmith>=0.1.0",
    "python-dotenv>=1.0.0",
    "duckduckgo-search>=6.0.0",
    "ddgs>=9.0.0",
    "tavily-python>=0.5.0",
    "ipywidgets>=8.0.0",
    "jupyter>=1.0.0",
    "ipykernel>=6.0.0",
    "gradio>=4.0.0",
    "matplotlib>=3.7.0",
]
