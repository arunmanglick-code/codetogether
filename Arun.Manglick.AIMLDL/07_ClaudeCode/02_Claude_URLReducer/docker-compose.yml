services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: urlreducer
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-urlreducer}
      POSTGRES_DB: urlreducer
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U urlreducer"]
      interval: 5s
      timeout: 3s
      retries: 5

  temporal:
    image: temporalio/auto-setup:latest
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=urlreducer
      - POSTGRES_PWD=${POSTGRES_PASSWORD:-urlreducer}
      - POSTGRES_SEEDS=db
    ports:
      - "7233:7233"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "tctl", "--address", "temporal:7233", "cluster", "health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  temporal-ui:
    image: temporalio/ui:latest
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:8233
    ports:
      - "8233:8080"
    depends_on:
      temporal:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://urlreducer:${POSTGRES_PASSWORD:-urlreducer}@db:5432/urlreducer
      BASE_URL: ${BASE_URL:-http://localhost:8000}
      CORS_ORIGINS: '["http://localhost:3000","http://localhost:5173"]'
      PYTHONPATH: /app
      TEMPORAL_SERVER_URL: temporal:7233
      TEMPORAL_NAMESPACE: default
      TEMPORAL_TASK_QUEUE: url-reducer
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      temporal:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  temporal-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://urlreducer:${POSTGRES_PASSWORD:-urlreducer}@db:5432/urlreducer
      PYTHONPATH: /app
      TEMPORAL_SERVER_URL: temporal:7233
      TEMPORAL_NAMESPACE: default
      TEMPORAL_TASK_QUEUE: url-reducer
    depends_on:
      temporal:
        condition: service_healthy
      db:
        condition: service_healthy
    command: python -m app.temporal.worker

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
